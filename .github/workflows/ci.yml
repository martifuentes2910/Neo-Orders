name: CI
on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NeoOrdersApp.slnx
      - name: Build
        run: dotnet build NeoOrdersApp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test NeoOrdersApp.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.5
        if: always()
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'TestResults/CoverageReport'
          reporttypes: 'HtmlInline;TextSummary'
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
