name: CI
on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NeoOrdersApp.slnx
      - name: Build
        run: dotnet build NeoOrdersApp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test NeoOrdersApp.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
