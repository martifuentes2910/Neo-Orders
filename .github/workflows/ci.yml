name: CI
on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NeoOrdersApp.slnx
      - name: Build
        run: dotnet build NeoOrdersApp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test NeoOrdersApp.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Coverage report
        if: always()
        shell: pwsh
        run: reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"TestResults/CoverageReport" -reporttypes:"HtmlInline;TextSummary"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
