<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoOrders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#eef4ec" />
    <script>
      (function(){
        var t=localStorage.getItem('neoorders.theme')||'claro';
        var p=localStorage.getItem('neoorders.palette');
        var r=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro'):t;
        var el=document.documentElement;
        el.setAttribute('data-theme',r);
        if(p==='coral'||p==='menta'||p==='clean') el.setAttribute('data-palette',p);
        el.classList.toggle('dark',r==='oscuro');
        var meta=document.querySelector('meta[name="theme-color"]');
        if(meta) {
          var dark = p==='clean' ? '#0b1512' : '#09090b';
          var light = p==='clean' ? '#eef4ec' : '#f7f7f5';
          meta.setAttribute('content', r==='oscuro' ? dark : light);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
